[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail_return_quality_action"
version = "0.1.0"
description = "本地合成零售售后与质检风险分析"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
retail-return-quality-action = "retail_return_quality_action.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_return_quality_action = ["py.typed"]
